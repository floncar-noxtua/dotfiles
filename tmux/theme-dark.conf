# Catppuccin Frappe. Sourced by the client-dark-theme hook in tmux.conf, which
# tmux fires when Ghostty reports a dark theme over DEC mode 2031.
# Mirrors theme-light.conf; keep the two in step when changing either.
#
# Keep in sync with the `dark:` half of ghostty/config's theme, or the pane
# colours won't match the terminal background.

set -g status-style 'bg=#414559,fg=#c6d0f5'
set -g status-left '#[bg=#8caaee,fg=#303446,bold] #S #[bg=#414559,fg=#8caaee]'
set -g status-left-length 20

set -g window-status-current-style 'bg=#8caaee,fg=#303446,bold'
set -g window-status-style 'bg=#414559,fg=#a5adce'
set -g window-status-activity-style 'bg=#414559,fg=#ef9f76'

set -g pane-border-style 'fg=#51576d'
set -g pane-active-border-style 'fg=#8caaee,bold'

# Keeps the status bar's own background -- see the long note in
# theme-light.conf for why a contrasting message block looks broken.
# #e5c890 on #414559 is 5.85:1, matching the light theme's 5.95:1.
set -g message-style 'bg=#414559,fg=#e5c890,bold'
set -g message-command-style 'bg=#414559,fg=#8caaee,bold'

set -g mode-style 'bg=#babbf1,fg=#303446'
set -g copy-mode-current-match-style 'bg=#e5c890,fg=#303446'
