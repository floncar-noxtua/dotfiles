# Catppuccin Frappe. Sourced by the client-dark-theme hook in tmux.conf, which
# tmux fires when Ghostty reports a dark theme over DEC mode 2031.
# Mirrors theme-light.conf; keep the two in step when changing either.
#
# Keep in sync with the `dark:` half of ghostty/config's theme, or the pane
# colours won't match the terminal background.

# The bar sits on the terminal background (#303446), not a band of its own.
set -g status-style 'bg=default,fg=#c6d0f5'

set -g window-status-current-style 'bg=#8caaee,fg=#303446,bold'
set -g window-status-style 'bg=default,fg=#a5adce'
set -g window-status-activity-style 'bg=default,fg=#ef9f76'

set -g pane-border-style 'default'
set -g pane-active-border-style 'default'

# Borders are blank gaps, so panes are told apart by background: the active
# pane keeps the terminal's #303446, inactive panes sit a shade darker,
# halfway to Frappe's mantle #292c3c. The active colour must be spelled out:
# with `default`, tmux falls back to window-style for the active pane too.
set -g window-style 'bg=#2c3041'
set -g window-active-style 'bg=#303446'

# Keeps the status bar's own background -- see the long note in
# theme-light.conf for why a contrasting message block looks broken.
# #e5c890 on #303446 is 7.62:1.
set -g message-style 'bg=default,fg=#e5c890,bold'
set -g message-command-style 'bg=default,fg=#8caaee,bold'

set -g mode-style 'bg=#babbf1,fg=#303446'
set -g copy-mode-current-match-style 'bg=#e5c890,fg=#303446'
