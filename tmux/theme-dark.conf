# Catppuccin Frappe. Sourced via ~/.tmux-theme.conf, which `gtheme` points here.
# Mirrors theme-light.conf; keep the two in step when changing either.
#
# Keep in sync with ghostty/config: this must always match whichever theme
# `gtheme dark` sets there (DARK= in bin/ghostty-theme), or the pane colours
# won't match the terminal background.

set -g status-style 'bg=#414559,fg=#c6d0f5'
set -g status-left '#[bg=#8caaee,fg=#303446,bold] #S #[bg=#414559,fg=#8caaee]'
set -g status-left-length 20

set -g window-status-current-style 'bg=#8caaee,fg=#303446,bold'
set -g window-status-style 'bg=#414559,fg=#a5adce'
set -g window-status-activity-style 'bg=#414559,fg=#ef9f76'

set -g pane-border-style 'fg=#51576d'
set -g pane-active-border-style 'fg=#8caaee,bold'

set -g message-style 'bg=#8caaee,fg=#303446,bold'
set -g mode-style 'bg=#babbf1,fg=#303446'
set -g copy-mode-current-match-style 'bg=#e5c890,fg=#303446'
