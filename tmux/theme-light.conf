# Modus Operandi Tinted. Sourced by the client-light-theme hook in tmux.conf,
# which tmux fires when Ghostty reports a light theme over DEC mode 2031.
#
# Chosen for contrast: Catppuccin Latte's ANSI colours only reached 2.31:1 against
# its background (WCAG AA wants 4.5:1), which made this status bar wash out in
# light mode. This palette reaches ~6.6:1.
#
# Keep in sync with the `light:` half of ghostty/config's theme, or the pane
# colours won't match the terminal background.

set -g status-style 'bg=#c2bcb5,fg=#000000'
set -g status-left '#[bg=#0031a9,fg=#fbf7f0,bold] #S #[bg=#c2bcb5,fg=#0031a9]'
set -g status-left-length 20

set -g window-status-current-style 'bg=#0031a9,fg=#fbf7f0,bold'
set -g window-status-style 'bg=#c2bcb5,fg=#3d3d3d'
set -g window-status-activity-style 'bg=#c2bcb5,fg=#a60000'

set -g pane-border-style 'fg=#c2bcb5'
set -g pane-active-border-style 'fg=#0031a9,bold'

# message-style deliberately keeps the status bar's own background. Setting
# message-style at all makes tmux skip clearing the rest of the status line
# while a prompt is open, so status-right stays on screen beside it (verified
# on 3.7b: even `message-style default` triggers it, and unsetting the option
# restores the clear). A contrasting block made that leftover look like a
# half-repainted bar. Matching the bar background makes it read as part of the
# bar instead, and the foreground carries the emphasis: 5.95:1 on #c2bcb5.
set -g message-style 'bg=#c2bcb5,fg=#721045,bold'
set -g message-command-style 'bg=#c2bcb5,fg=#0031a9,bold'

set -g mode-style 'bg=#721045,fg=#fbf7f0'
set -g copy-mode-current-match-style 'bg=#6f5500,fg=#fbf7f0'
