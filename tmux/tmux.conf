# =============================================================================
# TERMINAL & RENDERING
# =============================================================================
# Use true color (24-bit) for better rendering and font display
set -g default-terminal "tmux-256color"
# Ghostty reports TERM=xterm-ghostty (not xterm-256color), so it needs its
# own entry here or truecolor/background colors don't pass through to it.
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

set -g renumber-windows on

# Reduce escape-time for faster responsiveness (helps with rendering)
set -sg escape-time 0

set -g @plugin 'tmux/plugins-tpm'


# =============================================================================
# PANE NAVIGATION & RESIZING
# =============================================================================
# Remap arrow keys to hjkl for pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Optional: Remap arrow keys for pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use vim keybindings in copy mode
setw -g mode-keys vi

# vim-style copy/paste
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# set -g pane-border-lines 'double'   # Thicker looking
set -g pane-border-lines 'heavy'    # Heaviest

# All colours live in tmux/theme-{light,dark}.conf. `gtheme` points the symlink
# below at whichever matches Ghostty, so the status bar keeps real contrast in
# both themes instead of washing out. -q so a missing symlink is not an error.
# Keep these theme files in sync with ghostty/config's LIGHT/DARK theme names.
source-file -q ~/.tmux-theme.conf

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# tmux restart
# tmux source-file ~/.tmux.conf

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix
