# =============================================================================
# TERMINAL & RENDERING
# =============================================================================
# Use true color (24-bit) for better rendering and font display
set -g default-terminal "tmux-256color"
# Ghostty reports TERM=xterm-ghostty (not xterm-256color), so it needs its
# own entry here or truecolor/background colors don't pass through to it.
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

set -g renumber-windows on

# Reduce escape-time for faster responsiveness (helps with rendering)
set -sg escape-time 0

set -g @plugin 'tmux/plugins-tpm'


# =============================================================================
# PANE NAVIGATION & RESIZING
# =============================================================================
# Remap arrow keys to hjkl for pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Optional: Remap arrow keys for pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use vim keybindings in copy mode
setw -g mode-keys vi

# vim-style copy/paste
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Quote selection into the prompt (like Claude desktop's quote): prefix each
# line with "> ", paste with bracketed paste (-p) so Claude Code doesn't submit,
# and leave a blank line to type the comment under.
bind-key -T copy-mode-vi > send-keys -X copy-pipe-and-cancel \
  "sed 's/[[:space:]]*\$//; s/^/> /' | { cat; printf '\\n\\n'; } | tmux load-buffer -b quote - && tmux paste-buffer -p -d -b quote"

# The line is drawn centred in its one-cell border with the pane background on
# either side, so it reads as gap | line | gap. `heavy` is the thickest glyph.
set -g pane-border-lines heavy

# Status bar layout; colours live in the theme files.
set -g status-justify left
set -g window-status-separator ''
set -g window-status-format         ' #I #W '
set -g window-status-current-format ' #I #W '
set -g status-right '#{?client_prefix,#[reverse] PREFIX #[noreverse] ,} %H:%M '
set -g status-right-length 60

# All colours live in tmux/theme-{light,dark}.conf. tmux 3.6+ subscribes to DEC
# mode 2031 on the outer terminal, so Ghostty tells it directly when the macOS
# appearance flips and these hooks fire. No symlink, no `tmux source-file` from
# a script, nothing to keep in sync by hand.
set-hook -g client-light-theme 'source-file ~/dotfiles/tmux/theme-light.conf'
set-hook -g client-dark-theme  'source-file ~/dotfiles/tmux/theme-dark.conf'

# Hooks only fire on a *change*, so paint once at startup to match the client
# we are attaching to right now.
if-shell -F '#{==:#{client_theme},light}' \
  'source-file ~/dotfiles/tmux/theme-light.conf' \
  'source-file ~/dotfiles/tmux/theme-dark.conf'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# tmux restart
# tmux source-file ~/.tmux.conf

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix
